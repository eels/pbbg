services:
  redis:
    image: redis:7.4.0-alpine
    restart: unless-stopped
    ports:
      - 6379:6379

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - ./docker/pocketbase/pb_data:/pb_data
      - ./docker/pocketbase/pb_migrations:/pb_migrations
